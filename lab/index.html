<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>方块样式 · 第二轮</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/shared.css">
<style>
  body{ padding-bottom: 56px; }
  .wrap{ max-width: 480px; }
  h1{ font-size: 22px; margin: 26px 0 4px; }
  .sub{ color: var(--ink-soft); font-size: 13px; line-height: 1.75; margin: 0 0 6px; }
  h2{
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--ink-dim);
    margin: 32px 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .h2note{ font-size: 12px; color: var(--ink-dim); line-height: 1.7; margin: 0 0 14px; }
  .grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt{ background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 11px 11px 13px; }
  .opt.pick{ border-color: rgba(34,211,238,.5); box-shadow: 0 0 22px rgba(34,211,238,.12); }
  .tag{ display: flex; align-items: baseline; gap: 6px; margin-bottom: 9px; }
  .no{ font-family: var(--mono); font-size: 14px; color: var(--n-cyan); }
  .nm{ font-size: 12.5px; font-weight: 500; }
  .ds{ font-size: 11px; color: var(--ink-dim); line-height: 1.65; margin-top: 9px; }
  canvas{ display: block; width: 100%; height: auto; border-radius: 8px; background: rgba(6,10,20,.7); }
  /* 磨砂玻璃按钮（你选的那版） */
  .pads{ display: grid; grid-template-columns: 1fr 1fr; gap: 9px; align-items: start; }
  .pad-g{ display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .k{
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 58px; border-radius: 18px; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ink-soft);
    background: linear-gradient(150deg, rgba(255,255,255,.11), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 18px rgba(0,0,0,.30);
    -webkit-tap-highlight-color: transparent; user-select: none;
    transition: transform .08s, background .12s;
  }
  .k svg{ width: 24px; height: 24px; display: block; }
  .k em{ font-style: normal; opacity: .8; }
  .k:active{ transform: translateY(1px); background: linear-gradient(150deg, rgba(34,211,238,.26), rgba(34,211,238,.08)); }
  .k-drop{
    grid-column: span 2; min-height: 50px;
    background: linear-gradient(150deg, rgba(34,211,238,.26), rgba(168,85,247,.12));
    border-color: rgba(120,235,255,.34);
  }
  .k-drop em{ color: #a5f2ff; opacity: 1; }
  .k-drop svg{ color: #a5f2ff; }
  .iconset{ margin-bottom: 14px; }

  .note{
    margin-top: 30px; padding: 14px 16px; border: 1px dashed var(--line-2);
    border-radius: 14px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.85;
  }
  .note b{ color: var(--ink); }
</style>
</head>
<body>
<div class="topline"></div>
<div class="wrap">

  <h1>第三轮 · 色块区分</h1>
  <p class="sub">真正容易混的是 <b>青 / 蓝 / 紫</b> 和 <b>红 / 橙 / 黄</b> 这两组，所以除了描边，配色本身也调了。每张图最下面两行就是把这些颜色<b>故意排在一起</b>，专门看分不分得开。</p>

  <h2>沿用现在的配色 · 只改样式</h2>
  <p class="h2note">B1 和 B4 的延伸。主要靠<b>加宽方块之间的缝隙</b>来分离——比加亮描边更管用，而且不刺眼。</p>
  <div class="grid2" id="setN"></div>

  <h2>换一套配色 · 把明度拉开</h2>
  <p class="h2note">青调亮、蓝压暗、紫偏红一点，三个蓝色系就不会挤在一起；红橙黄同理。整体饱和度略降，长时间看不累。</p>
  <div class="grid2" id="setP"></div>

  <div class="note">
    已经定了：按钮<b>磨砂玻璃</b>、图标<b>iii 粗角括号</b>。<br>
    方块选一个编号告诉我就行，比如「N2」「P3」。
  </div>

</div>

<script>
// 现有配色
const P1=['#22d3ee','#fbbf24','#a855f7','#4ade80','#f43f5e','#3b82f6','#fb923c'];
// 调过的：蓝色系明度拉开，红橙黄错开，整体饱和度略降
const P2=['#5ee7f5','#f2c14e','#a463dd','#56c877','#e8546b','#3f6fd0','#ef8f4a'];

const n=null, G=-1;
const SCENE=[
  [n,n,n,n,n,n],
  [n,n,G,G,n,n],
  [n,n,n,n,n,n],
  [n,n,2,2,n,n],
  [n,n,n,2,2,n],
  [0,0,n,n,4,4],
  [1,1,1,3,3,5],
  [6,1,5,5,3,5],
  [0,5,2,0,5,2],   // 青 蓝 紫 —— 最容易混的一组
  [4,6,1,4,6,1],   // 红 橙 黄
];

function hx(h){ return h.length===4? h.slice(1).split('').map(x=>parseInt(x+x,16)) : [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function mix(a,b,t){ const A=hx(a),B=hx(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); if(r<=0){c.rect(x,y,w,h);return;} if(c.roundRect){c.roundRect(x,y,w,h,r);return;}
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

// gap 缝隙 / fill 填充压暗 / edge 描边提亮(0=不描边) / lw 线宽 / rad 圆角 / ring 暗外圈
const V={
  N1:{pal:P1, gap:.10, fill:.14, edge:.30, lw:.07,  rad:.20},
  N2:{pal:P1, gap:.10, fill:.22, edge:.40, lw:.06,  rad:.26},
  N3:{pal:P1, gap:.085,fill:.14, edge:.32, lw:.07,  rad:.20, ring:.40},
  N4:{pal:P1, gap:.13, fill:.10, edge:0,   lw:0,    rad:.22},
  P1v:{pal:P2, gap:.10, fill:.14, edge:.30, lw:.07, rad:.20},
  P2v:{pal:P2, gap:.13, fill:.10, edge:0,   lw:0,   rad:.22},
  P3v:{pal:P2, gap:.10, fill:.20, edge:.34, lw:.065,rad:.26},
  P4v:{pal:P2, gap:.085,fill:.14, edge:.30, lw:.07, rad:.20, ring:.42},
};

function cell(c,v,px,py,s,color,ghost){
  const g=s*v.gap, x=px+g, y=py+g, d=s-g*2, R=v.rad*d;
  c.save();
  if(ghost){
    c.globalAlpha=.40; c.strokeStyle=color; c.lineWidth=Math.max(1.5,d*.075);
    rr(c,x+1,y+1,d-2,d-2,R); c.stroke();
    c.globalAlpha=.07; c.fillStyle=color; c.fill(); c.restore(); return;
  }
  c.fillStyle=mix(color,'#0a1020',v.fill);
  rr(c,x,y,d,d,R); c.fill();
  let off=0;
  if(v.ring){                       // 压一圈暗边，不靠亮度也能分开相邻方块
    const lw=Math.max(1,d*.09);
    c.strokeStyle=mix(color,'#050912',v.ring); c.lineWidth=lw;
    rr(c,x+lw/2,y+lw/2,d-lw,d-lw,Math.max(0,R-lw/2)); c.stroke();
    off=lw;
  }
  if(v.edge){
    const lw=Math.max(1,d*v.lw); const o=off+lw/2;
    c.strokeStyle=mix(color,'#ffffff',v.edge); c.lineWidth=lw;
    rr(c,x+o,y+o,d-o*2,d-o*2,Math.max(0,R-o)); c.stroke();
  }
  c.restore();
}

function draw(cv,key){
  const v=V[key], dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth, cs=w/6, h=cs*SCENE.length;
  cv.style.height=h+'px'; cv.width=w*dpr; cv.height=h*dpr;
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.strokeStyle='rgba(120,160,255,.07)'; c.lineWidth=1;
  for(let i=1;i<6;i++){ c.beginPath(); c.moveTo(i*cs+.5,0); c.lineTo(i*cs+.5,h); c.stroke(); }
  for(let i=1;i<SCENE.length;i++){ c.beginPath(); c.moveTo(0,i*cs+.5); c.lineTo(w,i*cs+.5); c.stroke(); }
  SCENE.forEach((row,yy)=>row.forEach((val,xx)=>{
    if(val===n) return;
    cell(c,v,xx*cs,yy*cs,cs, val===G ? v.pal[2] : v.pal[val], val===G);
  }));
}

const META={
  N1:['N1','缝隙版','B1 加宽缝隙、描边收柔。靠留白分离，不靠亮度。'],
  N2:['N2','柔和版','B4 的调子但描边不再接近白，圆角更大，最不刺眼。'],
  N3:['N3','暗圈版','每块先压一圈暗边再描柔亮边，相邻色自带分界，区分最强。'],
  N4:['N4','纯色版','完全不描边，只靠宽缝隙和纯色。最干净，眼睛负担最小。'],
  P1v:['P1','缝隙版 + 新配色','N1 的样式，换成拉开明度的配色。'],
  P2v:['P2','纯色版 + 新配色','N4 的样式配新配色。最简洁，看最后两行。'],
  P3v:['P3','柔和版 + 新配色','N2 的样式配新配色，整体最柔。'],
  P4v:['P4','暗圈版 + 新配色','N3 的样式配新配色，区分度天花板。'],
};
function build(id,keys){
  const w=document.getElementById(id);
  keys.forEach(k=>{
    const d=document.createElement('div'); d.className='opt';
    d.innerHTML=`<div class="tag"><span class="no">${META[k][0]}</span><span class="nm">${META[k][1]}</span></div>
                 <canvas></canvas><div class="ds">${META[k][2]}</div>`;
    w.appendChild(d);
    requestAnimationFrame(()=>draw(d.querySelector('canvas'),k));
  });
}
build('setN',['N1','N2','N3','N4']);
build('setP',['P1v','P2v','P3v','P4v']);
addEventListener('resize',()=>{
  [['setN',['N1','N2','N3','N4']],['setP',['P1v','P2v','P3v','P4v']]].forEach(([id,ks])=>
    document.querySelectorAll('#'+id+' canvas').forEach((cv,i)=>draw(cv,ks[i])));
});
</script>
</body>
</html>
