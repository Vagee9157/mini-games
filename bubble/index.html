<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#080b14">
<title>泡泡龙 · 小游戏合集</title>
<meta name="description" content="浏览器里的泡泡龙，拖着瞄准松手发射，三个同色就消，悬空的一串会跟着掉。">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="泡泡龙">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/shared.css?v=5c706aa6">
<link rel="stylesheet" href="../assets/ui.css?v=9c37111d">
<link rel="stylesheet" href="bubble.css?v=2e6531ed">
</head>
<body>
<div class="topline"></div>

<div class="game">

  <header class="bar">
    <a class="back" href="../">← 合集</a>
    <h1>泡泡龙<em>BUBBLE</em></h1>
    <div class="sp"></div>
    <button class="tbtn tbtn-sq" id="muteBtn" aria-label="音效开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.5 9H3v6h3.5L11 19z"/>
        <path class="wave" d="M15.6 8.6a5 5 0 0 1 0 6.8"/>
        <path class="wave" d="M18.4 5.8a9 9 0 0 1 0 12.4"/>
        <path class="cross" d="m16.5 9.5 5 5m0-5-5 5"/>
      </svg>
    </button>
    <button class="tbtn" id="lvBtn">选关</button>
    <button class="tbtn" id="restartBtn">重开</button>
  </header>

  <div class="hud">
    <div class="cell hi"><span>关卡</span><b id="lvName">1</b></div>
    <div class="cell" id="goalCell"><span>目标</span><b id="goal">清空</b></div>
    <div class="cell" id="shotsCell"><span>剩余</span><b id="shots">0</b></div>
    <div class="cell"><span>得分</span><b id="score">0</b></div>
    <div class="cell next"><span>下一颗</span><canvas id="nextCv"></canvas></div>
  </div>

  <div class="boardwrap" id="boardWrap">
    <canvas id="board"></canvas>
    <div class="toast" id="toast"></div>

    <div class="overlay" id="overlay" data-mode="start">
      <div class="card">
        <div data-when="start">
          <h2>泡泡<span class="neon">龙</span></h2>
          <p>
            <b>拖着瞄准，松手就发</b>，瞄准线把撞墙反弹算进去了。<br>
            三个同色连上就消，<b>被打断的一串会整片掉下来</b>。<br>
            一杆消掉五颗以上会掉<b>道具</b>：炸弹、彩虹、激光。<br>
            <b>石头</b>打不消，只能靠断开让它掉；<b>冰冻泡</b>要在旁边消两次才化。
          </p>
          <div class="prog">已解锁 <b id="startLv">1 / 20</b></div>
          <button class="pbtn" id="startBtn">继续闯关</button>
          <button class="pbtn ghost" id="pickBtn">选关</button>
        </div>
        <div data-when="win">
          <h2>过<span class="neon">关</span></h2>
        </div>
        <div data-when="lose">
          <h2>没<span class="warn">过</span></h2>
          <p id="endWhy"></p>
        </div>
        <div class="stars" id="endStars" data-when="win lose"></div>
        <div class="final" data-when="win lose">
          <div><span>关卡</span><b id="endLv">1</b></div>
          <div><span>得分</span><b id="endScore">0</b></div>
        </div>
        <button class="pbtn" id="nextBtn" data-when="win">下一关</button>
        <button class="pbtn ghost" id="againBtn" data-when="win lose">再来一次</button>
    </div>
  </div>

  <div class="pad">
    <div class="powerbar" id="powerBar"></div>
    <button class="k hot" id="fireBtn" aria-label="发射">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V6"/><path d="M6.5 11.5 12 6l5.5 5.5"/>
      </svg>
      <em>发射</em>
    </button>
  </div>
  <div class="hint">拖着瞄准 · 松手发射 · 点旁边那颗换手 · 道具点一下装上 · 键盘 ←→ 空格 Shift 1/2/3</div>


  <div class="lvsheet" id="lvSheet" hidden>
    <div class="lvbox">
      <div class="lvtop">
        <h3>选关</h3>
        <span class="lvstars">★ <b id="lvStars">0 / 60</b></span>
        <button class="row-btn" id="lvClose">关闭</button>
      </div>
      <div class="lvgrid" id="lvGrid"></div>
    </div>
  </div>

</div>

<script src="bubble.js?v=4c882dbd"></script>
<script>
// 注册 Service Worker：装好之后断网也能玩（高铁、地铁、飞机上）
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
}
</script>
</body>
</html>
