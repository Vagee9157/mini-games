<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#080b14">
<title>疯狂俄罗斯方块 · 小游戏合集</title>
<meta name="description" content="加了 FEVER、黄金方块和行雨的俄罗斯方块，分数会爆。">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="疯狂方块">
<link rel="apple-touch-icon" href="../assets/icons/crazy-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/shared.css?v=5c706aa6">
<link rel="stylesheet" href="../tetris/tetris.css?v=7937dc5d">
</head>
<body>
<div class="topline"></div>

<div class="game">


  <div class="stage">

    <header class="bar">
      <a class="back" href="../">← 合集</a>
      <h1>疯狂方块<em>CRAZY</em></h1>
      <div class="sp"></div>
      <button class="tbtn tbtn-ic" id="skinBtn" aria-label="换方块样式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><circle cx="9" cy="9.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.6" cy="9.6" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.4" cy="14.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="9.6" cy="14.8" r="1.1" fill="currentColor" stroke="none"/></svg><span>样式</span></button>
      <button class="tbtn tbtn-sq" id="muteBtn" aria-label="音效开关"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path class="wave" d="M15.6 8.6a5 5 0 0 1 0 6.8"/><path class="wave" d="M18.4 5.8a9 9 0 0 1 0 12.4"/><path class="cross" d="m16.5 9.5 5 5m0-5-5 5"/></svg></button>
      <button class="tbtn tbtn-ic" id="pauseBtn" aria-label="暂停"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="pauseIc" d="M9.5 6.5v11M14.5 6.5v11"/></svg><span id="pauseTx">暂停</span></button>
      <button class="tbtn tbtn-ic" id="restartBtn" aria-label="重开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 12a7.4 7.4 0 1 1-2.2-5.3"/><path d="M19.4 4.4v4.5h-4.5"/></svg><span>重开</span></button>
    </header>

    <div class="board-wrap" id="boardWrap">
     <div class="board-box">
      <div class="shaker" id="shaker">
       <canvas id="board"></canvas>
       <div class="board-aura" id="boardAura" aria-hidden="true"></div>
       <div class="danger" id="danger" aria-hidden="true"></div>
      </div>
      <div class="fx" id="fx" aria-hidden="true"></div>
      <div class="feverbar" aria-hidden="true">FEVER ×4</div>
      <div class="streak" id="streak" aria-hidden="true">
       <!-- 热度徽章只有疯狂版会点亮（syncHeat 开头就 !CRAZY 早退），
            标准版里它永远拿不到 .on，等于不存在 -->
       <span class="badge heat" id="badgeHeat">×1.0</span>
       <span class="badge b2b" id="badgeB2B">B2B</span>
       <span class="badge cmb" id="badgeCombo">COMBO ×1</span>
      </div>

      <div class="overlay" id="overlay" data-mode="start">
        <div class="card">

          <div data-when="start">
            <h2>疯狂<span class="warn">方块</span></h2>
            <p>
              下面四个键：<b>左移 · 右移 · 落底 · 变换</b>，点右边 HOLD 框暂存。<br>
              手机建议先点右上角<b>「游戏模式」</b>，横过来也能玩。
            </p>
            <button class="pbtn" id="resumeSaveBtn" data-save>接着上次玩 · <b id="resumeScore">0</b></button>
            <button class="pbtn" id="startBtn">开始</button>
          </div>

          <div data-when="pause">
            <h2>已暂停</h2>
            <p>喘口气。回来继续。</p>
            <button class="pbtn" id="resumeBtn">继续</button>
          </div>

          <div data-when="over">
            <h2>堆到顶了</h2>
            <div class="final">
              <div><span>SCORE</span><b id="overScore">0</b></div>
              <div><span>BEST</span><b id="overBest">0</b></div>
              <div><span>LINES</span><b id="overLines">0</b></div>
              <div><span>LEVEL</span><b id="overLevel">1</b></div>
              <div id="legacyCell" hidden><span>旧版纪录</span><b id="overLegacy">0</b></div>
            </div>
            <button class="pbtn" id="againBtn">再来一局</button>
          </div>

        </div>
      </div>

      <!-- 事件预告。捣乱事件必须提前三秒喊一声，没预告的惩罚是耍赖不是难度。 -->
      <div class="evwarn" id="evwarn" aria-hidden="true"></div>

      <!-- 梭哈。整套机制里唯一需要玩家主动做决定的地方，所以给了一个够大的点击区；
           它只在打出 TETRIS / T-spin 且热度够高时出现，十秒不理会自动作废。 -->
      <div class="allin" id="allin" aria-hidden="true">
        <span class="allin-txt"><b>梭哈</b>十秒内消行 ×2<br>没消到则热度清零</span>
        <button class="allin-go" id="allinGo" type="button">接受</button>
      </div>

      <div class="toast" id="toast"></div>
     </div>
    </div>

    <!-- 右侧：下一个 / 暂存 / 计分 -->
    <aside class="side">
      <div class="slot next">
        <span class="slot-label">NEXT</span>
        <canvas id="nextCv"></canvas>
      </div>

      <div class="slot hold" id="holdSlot" role="button" tabindex="0" aria-label="暂存当前方块">
        <span class="slot-label">HOLD</span>
        <canvas id="holdCv"></canvas>
      </div>

      <div class="stats">
        <div class="stat hi"><span>SCORE</span><b id="score">0</b></div>
        <div class="stat"><span>LINES</span><b id="lines">0</b></div>
        <div class="stat" id="levelBox"><span>LEVEL</span><b id="level">1</b></div>
        <div class="stat"><span>BEST</span><b id="best">0</b></div>
      </div>

    </aside>

    <!-- 按键区：一排四个。落底比旁边三个小一圈、贴着格子下沿，
         四周留出死区 —— 它是这里唯一不可撤销的操作，不该和别的键一样好按。 -->
    <div class="pads">
      <div class="pad-g pad-l">
        <button class="k" id="btnLeft"  aria-label="左移"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.8 7 9.4 12l5.4 5z"/></svg><em>左移</em></button>
        <button class="k" id="btnRight" aria-label="右移"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 7l5.4 5-5.4 5z"/></svg><em>右移</em></button>
      </div>
      <div class="pad-g pad-r">
        <button class="k k-drop" id="btnDrop" aria-label="直接落底"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6.4h8L12 13z"/><path d="M5.8 18.6h12.4" fill="none" stroke-width="2.8"/></svg><em>落底</em></button>
        <button class="k" id="btnCw" aria-label="顺时针旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.3" y="9.5" width="11" height="11" rx="2.6"/><path d="M9.4 5.4h5.4a4.2 4.2 0 0 1 4.2 4.2v3.2"/><path d="M16.5 10.9 19 13.8l2.5-2.9"/></svg><em>变换</em></button>
      </div>
    </div>

  </div>

  <div class="sheet" id="styleSheet" hidden>
    <div class="sheet-box">
      <div class="sheet-top">
        <h3>方块样式</h3>
        <button class="row-btn" id="musicBtn">音乐：开</button>
        <button class="row-btn" id="buzzBtn">震动：开</button>
      </div>
      <span class="sheet-lb">背景音乐</span>
      <div class="seg seg-3" id="trackOpts"></div>
      <span class="sheet-lb">音效风格</span>
      <div class="seg seg-3" id="packOpts"></div>
      <span class="sheet-lb">配色</span>
      <div class="seg" id="palOpts"></div>
      <span class="sheet-lb">画法</span>
      <div class="seg seg-4" id="styleOpts"></div>
      <button class="pbtn sheet-done" id="skinDone">好了</button>
    </div>
  </div>


</div>

<script>window.TETRIS_CRAZY = true;</script>
<script src="../tetris/tetris.js?v=69dc3a73"></script>
<script>
// 注册 Service Worker：装好之后断网也能玩（高铁、地铁、飞机上）
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
}
</script>
</body>
</html>
