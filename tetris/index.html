<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#080b14">
<title>俄罗斯方块 · 小游戏合集</title>
<meta name="description" content="浏览器里的俄罗斯方块，手机按键操作，竖屏横屏都能玩。">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方块">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/shared.css?v=5c706aa6">
<link rel="stylesheet" href="tetris.css?v=a50148ba">
</head>
<body>
<div class="topline"></div>

<div class="game">


  <div class="stage">

    <header class="bar">
      <a class="back" href="../">← 合集</a>
      <h1>俄罗斯方块<em>TETRIS</em></h1>
      <div class="sp"></div>
      <button class="tbtn" id="skinBtn" aria-label="换方块样式">样式</button>
      <button class="tbtn tbtn-sq" id="muteBtn" aria-label="音效开关"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path class="wave" d="M15.6 8.6a5 5 0 0 1 0 6.8"/><path class="wave" d="M18.4 5.8a9 9 0 0 1 0 12.4"/><path class="cross" d="m16.5 9.5 5 5m0-5-5 5"/></svg></button>
      <button class="tbtn tbtn-ic" id="fsBtn" aria-label="进入游戏模式"><i id="fsIc">⛶</i><span id="fsTx">游戏模式</span></button>
      <button class="tbtn" id="pauseBtn">暂停</button>
      <button class="tbtn" id="restartBtn">重开</button>
    </header>

    <div class="board-wrap" id="boardWrap">
     <div class="board-box">
      <canvas id="board"></canvas>

      <div class="overlay" id="overlay" data-mode="start">
        <div class="card">

          <div data-when="start">
            <h2>俄罗斯<span class="neon">方块</span></h2>
            <p>
              下面四个键：<b>左移 · 右移 · 落底 · 变换</b>，点右边 HOLD 框暂存。<br>
              手机建议先点右上角<b>「游戏模式」</b>，横过来也能玩。
            </p>
            <button class="pbtn" id="resumeSaveBtn" data-save>接着上次玩 · <b id="resumeScore">0</b></button>
            <button class="pbtn" id="startBtn">开始</button>
          </div>

          <div data-when="pause">
            <h2>已暂停</h2>
            <p>喘口气。回来继续。</p>
            <button class="pbtn" id="resumeBtn">继续</button>
          </div>

          <div data-when="over">
            <h2>堆到顶了</h2>
            <div class="final">
              <div><span>SCORE</span><b id="overScore">0</b></div>
              <div><span>BEST</span><b id="overBest">0</b></div>
              <div><span>LINES</span><b id="overLines">0</b></div>
              <div><span>LEVEL</span><b id="overLevel">1</b></div>
            </div>
            <button class="pbtn" id="againBtn">再来一局</button>
          </div>

        </div>
      </div>

      <div class="toast" id="toast"></div>
     </div>
    </div>

    <!-- 右侧：下一个 / 暂存 / 计分 -->
    <aside class="side">
      <div class="slot next">
        <span class="slot-label">NEXT</span>
        <canvas id="nextCv"></canvas>
      </div>

      <div class="slot hold" id="holdSlot" role="button" tabindex="0" aria-label="暂存当前方块">
        <span class="slot-label">HOLD</span>
        <canvas id="holdCv"></canvas>
      </div>

      <div class="stats">
        <div class="stat hi"><span>SCORE</span><b id="score">0</b></div>
        <div class="stat"><span>LINES</span><b id="lines">0</b></div>
        <div class="stat" id="levelBox"><span>LEVEL</span><b id="level">1</b></div>
        <div class="stat"><span>BEST</span><b id="best">0</b></div>
      </div>
    </aside>

    <!-- 按键区：一排四个 -->
    <div class="pads">
      <div class="pad-g pad-l">
        <button class="k" id="btnLeft"  aria-label="左移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 6.2 8.4 12l5.8 5.8"/></svg><em>左移</em></button>
        <button class="k" id="btnRight" aria-label="右移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 6.2 15.6 12l-5.8 5.8"/></svg><em>右移</em></button>
      </div>
      <div class="pad-g pad-r">
        <button class="k k-drop" id="btnDrop" aria-label="直接落底"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6v8.2"/><path d="M7.8 8 12 12.2 16.2 8"/><path d="M6.2 17.8h11.6"/></svg><em>落底</em></button>
        <button class="k" id="btnCw" aria-label="旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.2 12a7.2 7.2 0 1 1-2.1-5.1"/><path d="M19.2 4.6v4.4h-4.4"/></svg><em>变换</em></button>
      </div>
    </div>

  </div>

  <div class="sheet" id="styleSheet" hidden>
    <div class="sheet-box">
      <div class="sheet-top">
        <h3>方块样式</h3>
      </div>
      <span class="sheet-lb">配色</span>
      <div class="seg" id="palOpts"></div>
      <span class="sheet-lb">画法</span>
      <div class="seg seg-4" id="styleOpts"></div>
      <button class="pbtn sheet-done" id="skinDone">好了</button>
    </div>
  </div>


</div>

<script src="tetris.js?v=f70c6013"></script>
<script>
// 注册 Service Worker：装好之后断网也能玩（高铁、地铁、飞机上）
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
}
</script>
</body>
</html>
