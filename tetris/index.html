<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#080b14">
<title>俄罗斯方块 · 小游戏合集</title>
<meta name="description" content="浏览器里的俄罗斯方块，手机按键操作，竖屏横屏都能玩。">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方块">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/shared.css">
<link rel="stylesheet" href="tetris.css">
</head>
<body>
<div class="topline"></div>

<div class="game">


  <div class="stage">

    <header class="bar">
      <a class="back" href="../">← 合集</a>
      <h1>俄罗斯方块<em>TETRIS</em></h1>
      <div class="sp"></div>
      <button class="tbtn" id="fsBtn" aria-label="进入游戏模式">⛶ 游戏模式</button>
      <button class="tbtn" id="muteBtn">静音</button>
      <button class="tbtn" id="pauseBtn">暂停</button>
      <button class="tbtn" id="restartBtn">重开</button>
    </header>

    <div class="slot hold" id="holdSlot" role="button" tabindex="0" aria-label="暂存当前方块">
      <span class="slot-label">HOLD</span>
      <canvas id="holdCv"></canvas>
    </div>

    <div class="stats">
      <div class="stat hi"><span>SCORE</span><b id="score">0</b></div>
      <div class="stat"><span>LINES</span><b id="lines">0</b></div>
      <div class="stat" id="levelBox"><span>LEVEL</span><b id="level">1</b></div>
      <div class="stat"><span>BEST</span><b id="best">0</b></div>
    </div>

    <div class="slot next">
      <span class="slot-label">NEXT</span>
      <canvas id="nextCv"></canvas>
    </div>

    <div class="board-wrap" id="boardWrap">
     <div class="board-box">
      <canvas id="board"></canvas>

      <div class="overlay" id="overlay" data-mode="start">
        <div class="card">

          <div data-when="start">
            <h2>俄罗斯<span class="neon">方块</span></h2>
            <p>
              下面的按键操作：左右移动、旋转、软降、落底，点 HOLD 框暂存。<br>
              手机建议先点右上角<b>「游戏模式」</b>，横过来也能玩。
            </p>
            <button class="pbtn" id="startBtn">开始</button>
          </div>

          <div data-when="pause">
            <h2>已暂停</h2>
            <p>喘口气。回来继续。</p>
            <button class="pbtn" id="resumeBtn">继续</button>
          </div>

          <div data-when="over">
            <h2>堆到顶了</h2>
            <div class="final">
              <div><span>SCORE</span><b id="overScore">0</b></div>
              <div><span>BEST</span><b id="overBest">0</b></div>
              <div><span>LINES</span><b id="overLines">0</b></div>
              <div><span>LEVEL</span><b id="overLevel">1</b></div>
            </div>
            <button class="pbtn" id="againBtn">再来一局</button>
          </div>

        </div>
      </div>

      <div class="toast" id="toast"></div>
     </div>
    </div>

    <!-- 按键区：左手管移动，右手管旋转和落下 -->
    <div class="pads">
      <div class="pad pad-l">
        <button class="k" id="btnLeft"  aria-label="左移"><span class="ico">←</span></button>
        <button class="k" id="btnRight" aria-label="右移"><span class="ico">→</span></button>
        <button class="k k-wide" id="btnDown" aria-label="软降"><span class="ico">↓</span><em>软降</em></button>
      </div>
      <div class="pad pad-r">
        <button class="k" id="btnCcw" aria-label="逆时针旋转"><span class="ico">↺</span></button>
        <button class="k" id="btnCw"  aria-label="顺时针旋转"><span class="ico">↻</span></button>
        <button class="k k-wide k-accent" id="btnDrop" aria-label="直接落底"><span class="ico">⤓</span><em>落底</em></button>
      </div>
    </div>

  </div>

  <div class="hint">点 HOLD 框暂存<span class="only-wide"> · 键盘 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>空格</kbd> 也能玩</span> · 分数只存在这台设备上</div>

</div>

<script src="tetris.js"></script>
</body>
</html>
